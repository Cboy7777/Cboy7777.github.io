<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 40px 28px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .icon {
            font-size: 52px;
            margin-bottom: 8px;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #1d2129;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 14px;
            color: #86909c;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .main-link {
            display: inline-block;
            font-size: 15px;
            color: #1677ff;
            text-decoration: none;
            word-break: break-all;
            padding: 4px 0;
            margin-bottom:20px;
            font-weight: 500;
        }
        .main-link:active {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔗</div>
        <div class="title">提示</div>
        <div class="desc">如需浏览，请使用浏览器访问</div>
        <a href=" "
           target="_blank"
           rel="noopener noreferrer"
           class="main-link">
           https://tcnyu5m3jkso.feishu.cn/wiki/DTn2wGahviVVF7ktB44cIycSn9g
        </a >
    </div>
</body>
</html>
